name: Paired 50 native CostBench execution validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out study repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch pinned CostBench source
        shell: bash
        run: |
          git init "$RUNNER_TEMP/CostBench"
          git -C "$RUNNER_TEMP/CostBench" remote add origin https://github.com/JiayuJeff/CostBench.git
          git -C "$RUNNER_TEMP/CostBench" fetch --depth 1 origin 6424069f3f773ade076bcedbed302ed47cfb1837
          git -C "$RUNNER_TEMP/CostBench" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/CostBench" rev-parse HEAD)" = "6424069f3f773ade076bcedbed302ed47cfb1837"

      - name: Install pinned harness dependencies
        run: python -m pip install -r "$RUNNER_TEMP/CostBench/requirements.txt" numpy

      - name: Generate the pinned CostBench test search database
        working-directory: ${{ runner.temp }}/CostBench
        shell: bash
        run: |
          test ! -e env/data/runtime/id_history/id_generator_state_test.json
          python env/domains/travel/generate_search_space.py \
            --generate_test \
            --test_config_path env/domains/travel/travel_config.yaml \
            --num-times 5000 \
            --num-time-combinations 5000 \
            --seed 42
          mkdir -p env/data/static/search_spaces
          cp env/data/static/search_spaces/test/search_space.json env/data/static/search_spaces/test_search_space.json
          test -s env/data/static/search_spaces/test_search_space.json

      - name: Run protocol unit tests
        run: python -m unittest discover -s experiments/paired_50/native_execution -p 'test_*.py' -v

      - name: Reconstruct and audit all 100 frozen checkpoints
        run: python experiments/paired_50/native_execution/run_official_harness.py --costbench-root "$RUNNER_TEMP/CostBench" --limit 100
