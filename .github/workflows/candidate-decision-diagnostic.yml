name: Candidate-decision mechanism diagnostic

on:
  workflow_dispatch:
    inputs:
      run_paid_diagnostic:
        description: "Explicitly authorize at most 75 DeepSeek diagnostic requests, capped at 600000 tokens"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  candidate-diagnostic:
    if: inputs.run_paid_diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch pinned CostBench source
        shell: bash
        run: |
          git init "$RUNNER_TEMP/CostBench"
          git -C "$RUNNER_TEMP/CostBench" remote add origin https://github.com/JiayuJeff/CostBench.git
          git -C "$RUNNER_TEMP/CostBench" fetch --depth 1 origin 6424069f3f773ade076bcedbed302ed47cfb1837
          git -C "$RUNNER_TEMP/CostBench" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/CostBench" rev-parse HEAD)" = "6424069f3f773ade076bcedbed302ed47cfb1837"
      - name: Install pinned dependencies
        run: python -m pip install -r "$RUNNER_TEMP/CostBench/requirements.txt" numpy
      - name: Rebuild native search space
        working-directory: ${{ runner.temp }}/CostBench
        shell: bash
        run: |
          test ! -e env/data/runtime/id_history/id_generator_state_test.json
          python env/domains/travel/generate_search_space.py \
            --generate_test \
            --test_config_path env/domains/travel/travel_config.yaml \
            --num-times 5000 \
            --num-time-combinations 5000 \
            --seed 42
          cp env/data/static/search_spaces/test/search_space.json env/data/static/search_spaces/test_search_space.json
      - name: Run offline diagnostic preflight
        run: |
          python experiments/paired_50/native_execution/prepare_candidate_diagnostic.py \
            --costbench-root "$RUNNER_TEMP/CostBench" \
            --out "$RUNNER_TEMP/candidate-diagnostic-preflight.json"
          python experiments/paired_50/native_execution/run_candidate_diagnostic.py \
            --costbench-root "$RUNNER_TEMP/CostBench" \
            --limit 75
      - name: Validate access to DeepSeek without exposing secret
        shell: bash
        run: test -n "$DEEPSEEK_API_KEY"
      - name: Execute candidate-decision diagnostics
        run: |
          python experiments/paired_50/native_execution/run_candidate_diagnostic.py \
            --costbench-root "$RUNNER_TEMP/CostBench" \
            --out "$RUNNER_TEMP/candidate-diagnostic-results" \
            --cap 600000 \
            --max-tokens 512 \
            --limit 75 \
            --live
      - name: Upload raw diagnostic records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-decision-results
          path: |
            ${{ runner.temp }}/candidate-diagnostic-preflight.json
            ${{ runner.temp }}/candidate-diagnostic-results/
          if-no-files-found: warn
          retention-days: 90
